Container@PLAYER_WIDGETS:
	Logic: MenuButtonsChromeLogic, DeployHotkeyLogic, SelectionStripLogic
	Children:
		LogicKeyListener@DEPLOY_KEY_LISTENER:
		LogicTicker@SIDEBAR_TICKER:
		LogicTicker@SELECTION_TICKER:
		# Bottom HUD. Four panels under the blue cap: radar, buildings,
		# selected units, then power / alloy / personnel.
		Background@BOTTOM_BAR:
			Background: hud-bar
			Y: WINDOW_HEIGHT - HEIGHT
			Width: WINDOW_WIDTH
			Height: 188
			Children:
				# Pipes rise above the cap. Their lowest pixel is the cap's
				# bottom edge, so no panel content is covered.
				Background@PIPE_RUN:
					Background: hud-pipe-run
					ClickThrough: true
					X: 48
					Y: -18
					Width: PARENT_WIDTH - 96
					Height: 40
				Image@PIPES_LEFT:
					X: 0
					Y: -18
					Width: 64
					Height: 40
					ImageCollection: hud-pipes
					ImageName: left
				Image@PIPES_RIGHT:
					X: PARENT_WIDTH - 64
					Y: -18
					Width: 64
					Height: 40
					ImageCollection: hud-pipes
					ImageName: right
				Background@RADAR_BG:
					Background: hud-well
					X: 8
					Y: 22
					Width: 160
					Height: 160
					Children:
						Radar@INGAME_RADAR:
							X: 6
							Y: 6
							Width: PARENT_WIDTH - 12
							Height: PARENT_HEIGHT - 12
							WorldInteractionController: INTERACTION_CONTROLLER
				Background@STRAND_RADAR:
					Background: hud-strand
					ClickThrough: true
					X: 168
					Y: 22
					Width: 24
					Height: 160
				Background@PORTRAIT_BG:
					Background: hud-well
					X: 568
					Y: 22
					Width: 160
					Height: 160
					Children:
						Image@SELECTION_PORTRAIT:
							Width: 160
							Height: 160
							ImageCollection: portraits
							ImageName: tank
							Visible: false
				SelectionPortraits@SELECTION_STRIP:
					X: 568
					Y: 62
					Width: PARENT_WIDTH - 880
					Height: 120
					IconWidth: 56
					IconHeight: 56
					IconSpacing: 6
					ImageCollection: portraits
					Visible: false
				Container@SELECTION_TEXT:
					X: 736
					Y: 30
					Width: PARENT_WIDTH - 1048
					Height: 60
					Children:
						Label@SELECTION_EMPTY:
							Width: PARENT_WIDTH
							Height: 25
							Font: Bold
							Contrast: true
							Text: label-selection-empty
						Label@SELECTION_NAME:
							Width: PARENT_WIDTH
							Height: 25
							Font: Title
							Contrast: true
							Visible: false
						Label@SELECTION_DETAIL:
							Y: 32
							Width: PARENT_WIDTH
							Height: 25
							Font: Bold
							Contrast: true
							Visible: false
				BuildingMenu@PRODUCTION:
					X: 196
					Y: 22
					Width: 344
					Height: 160
					Actors: fs_reactor, fs_plant, fs_vfoundry, fs_turret, fs_academy, fs_mfoundry, fs_assembly, fs_techlab
				Background@STRAND_BUILDINGS:
					Background: hud-strand
					ClickThrough: true
					X: 544
					Y: 22
					Width: 24
					Height: 160
				Background@STRAND_RESOURCES:
					Background: hud-strand
					ClickThrough: true
					X: PARENT_WIDTH - 304
					Y: 22
					Width: 24
					Height: 160
				Container@RESOURCES:
					Logic: ResourceCountersLogic
					X: PARENT_WIDTH - 272
					Y: 36
					Width: 248
					Height: 144
					Children:
						Image@ICON_POWER:
							ImageCollection: resource-icons
							ImageName: power
						Label@POWER_COUNT:
							X: 40
							Y: 2
							Width: 200
							Height: 28
							Font: Bold
							Contrast: true
						Image@ICON_ALLOY:
							Y: 48
							ImageCollection: resource-icons
							ImageName: alloy
						Label@ALLOY_COUNT:
							X: 40
							Y: 50
							Width: 200
							Height: 28
							Font: Bold
							Contrast: true
						Image@ICON_CREW:
							Y: 96
							ImageCollection: resource-icons
							ImageName: crew
						Label@CREW_COUNT:
							X: 40
							Y: 98
							Width: 200
							Height: 28
							Font: Bold
							Contrast: true
		MenuButton@OPTIONS_BUTTON:
			X: PARENT_WIDTH - WIDTH - 8
			Y: 8
			Width: 160
			Height: 25
			Text: button-observer-widgets-options
			Font: Bold
			Key: escape
		Container@ASSEMBLY_LOADOUT:
			Logic: AssemblyLoadoutLogic
			X: 176
			Y: WINDOW_HEIGHT - 250
			Width: 420
			Height: 56
			Visible: false
			Children:
				Background@ASSEMBLY_BG:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Label@ASSEMBLY_TITLE:
							X: 8
							Y: 4
							Width: PARENT_WIDTH - 16
							Height: 20
							Font: Bold
							Contrast: true
							Text: label-assembly-loadout-title
						Label@ASSEMBLY_DETAIL:
							X: 8
							Y: 28
							Width: PARENT_WIDTH - 16
							Height: 20
							Font: Regular
							Contrast: true
