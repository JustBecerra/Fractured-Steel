# T-330-inspired crawler dozer: forward cab, front blade, rear ripper.
# Same camera and world-units-per-pixel as the tank. 32 facings so in-place
# pivots read as a turn instead of an 8-way snap.
dozer:
	idle:
		Filename: sequences/assets/dozer.png
		Facings: -32
		IgnoreWorldTint: true
	icon:
		Filename: sequences/assets/dozer.png
		IgnoreWorldTint: true

# Tracked tank with a rear-mounted turret. Rendered from tank.blend through the
# same camera and ortho_scale as the dozer, so both units share a pixel scale.
# 32 facings so in-place pivots read as a turn instead of an 8-way snap.
tank:
	idle:
		Filename: sequences/assets/tank.png
		Facings: -32
		IgnoreWorldTint: true
	icon:
		Filename: sequences/assets/tank.png
		IgnoreWorldTint: true

# Headquarters. Single isometric view: buildings do not rotate. Rendered from
# hq.blend at the same world-units-per-pixel as the units. An 8-cell footprint
# matches the terrace, annex ring and fortifications around the central drum.
hq:
	idle:
		Filename: sequences/assets/hq.png
		Length: 3
		Tick: 140
		IgnoreWorldTint: true
	icon:
		Filename: sequences/assets/hq.png
		IgnoreWorldTint: true

# Crew Academy. Two front-facing barracks, ground flag, hedge rectangle.
# Same camera angle and pixel scale as the HQ. Three idle frames for the flag.
academy:
	idle:
		Filename: sequences/assets/academy.png
		Length: 3
		Tick: 140
		IgnoreWorldTint: true
	icon:
		Filename: sequences/assets/academy.png
		IgnoreWorldTint: true

# Exhaust puff trailed from the tank's rear outlets while it moves. The puff is
# the same from every angle, so one row of frames is enough. Each frame is a
# later point in one puff's life; LeavesTrails plays it once per spawn.
# Generated by tools/make_smoke_sheet.py.
smoke:
	idle:
		Filename: sequences/assets/smoke.png
		Length: 12
		Tick: 80
		IgnoreWorldTint: true

selectring:
	idle:
		Filename: sequences/assets/ring.png
		IgnoreWorldTint: true

# Scanner cone projected from the cabin while the unit is deployed to build.
# Frames are centred on the same point as the eship frames, so the overlay
# lines up with Offset: 0.
# The sheet is facing-major: one row per facing, 8 sweep steps per row, which
# matches the engine's `facingInner * stride + frame` lookup with Stride=Length.
scanner:
	idle:
		Filename: sequences/assets/scanner.png
		Length: 8
		Facings: -8
		Tick: 100
		IgnoreWorldTint: true

# Alloy junkyard heaps. Three variants, each with 3 density frames (sparse
# scatter → packed dump). ResourceRenderer picks a variant per cell and
# lerps the frame from the cell's density.
resources:
	Defaults:
		Filename: sequences/assets/alloy.png
		Length: 3
		IgnoreWorldTint: true
	junk01:
	junk02:
		Start: 3
	junk03:
		Start: 6

