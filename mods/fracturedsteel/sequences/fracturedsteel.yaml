# Layered Frame: legs (idle), assault torso, sword, shield. Packed facing-major.
# Facings stay on the body layers, not Defaults: the production icon is a
# single frame and must not inherit the 32-facing stride.
frame:
	Defaults:
		Filename: sequences/assets/frame.png
		IgnoreWorldTint: true
	idle:
		Facings: -32
	torso:
		Start: 32
		Facings: -32
	sword:
		Start: 64
		Facings: -32
	shield:
		Start: 96
		Facings: -32
	icon:
		Filename: sequences/assets/frame-icon.png


