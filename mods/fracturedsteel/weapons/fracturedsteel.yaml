^hitflash:
	Warhead@2Eff: CreateEffect
		Image: explosion
		Explosions: piff
		ExplosionPalette: greyscale
		ValidTargets: Ground, GroundActor

paladingun:
	ReloadDelay: 25
	Range: 6c0
	ValidTargets: Ground, GroundActor
	Projectile: InstantHit
	Warhead@1Dam: SpreadDamage
		Spread: 128
		Damage: 2500
		ValidTargets: GroundActor
	Warhead@2Eff: CreateRandomEffect
		Image: sparks
		Explosions: idle, left, right
		ExplosionPalette: greyscale
		ValidTargets: Ground, GroundActor

turretgun:
	Inherits: ^hitflash
	ReloadDelay: 25
	Range: 6c0
	ValidTargets: Ground, GroundActor
	Projectile: InstantHit
	Warhead@1Dam: SpreadDamage
		Spread: 128
		Damage: 2500
		ValidTargets: GroundActor

sword:
	Inherits: ^hitflash
	ReloadDelay: 30
	Range: 1c512
	ValidTargets: Ground, GroundActor
	Projectile: InstantHit
	Warhead@1Dam: SpreadDamage
		Spread: 256
		Damage: 4000
		ValidTargets: GroundActor
