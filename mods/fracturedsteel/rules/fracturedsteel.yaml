# Fractured Steel custom actors.
# Demonstrates MiniYaml inheritance: fs_sentinel derives from the base
# `example` actor (defined in rules/example.yaml) and overrides/extends it.

fs_sentinel:
	Inherits: example
	-Immobile:
	-WithSpriteBody:
	WithFacingSpriteBody:
	Mobile:
		Locomotor: fsvehicle
		Speed: 85
		TurnSpeed: 30
		TurnsWhileMoving: true
		Cursor: default
		BlockedCursor: default
	RenderSprites:
		Image: eship
	# Swap to the thrusters-firing frames while moving.
	WithMoveAnimation:
		MoveSequence: move
	GrantConditionOnMovement@MOVING:
		Condition: moving
		ValidMovementTypes: Horizontal
	# Deploying puts the unit into its "building" state. This is a stand-in for
	# the real worker-builds-buildings mechanic, which does not exist yet.
	GrantConditionOnDeploy:
		DeployedCondition: building
		DeployCursor: default
		DeployBlockedCursor: default
		UndeployOnMove: true
		SkipMakeAnimation: true
	# Scanner cone projected from the cabin while building.
	WithIdleOverlay@SCANNER:
		Image: scanner
		Sequence: idle
		RequiresCondition: building
	# Custom trait (OpenRA.Mods.Example): real light cast on the terrain under
	# the far end of the cone, about one and a half cells ahead of the cabin.
	ConditionalTerrainLightSource@SCANNER:
		RequiresCondition: building
		Range: 1c768
		Intensity: 0.15
		RedTint: 0.02
		GreenTint: 0.25
		BlueTint: 0.45
		Offset: 1c500,0,0
	# Subtle idle hover bob. Held steady while moving or scanning.
	Hovers:
		RequiresCondition: !moving && !building
		BobDistance: -48
		InitialHeight: 48
		Ticks: 14
		RiseTicks: 14
	Tooltip:
		Name: E-Ship
	Health:
		HP: 50000
	Selectable:
		Bounds: 48, 48
	# Keep SelectionDecorations for the health bar, but hide its corner-bracket
	# box (transparent) so only the custom green ground ring shows.
	SelectionDecorations:
		SelectionBoxColor: 00000000
	# Custom trait (OpenRA.Mods.Example): draws the ring in the world layer,
	# beneath the unit, only while selected.
	WithSelectionRing:
		Image: selectring
		Sequence: idle
		Palette: greyscale

# Tracked tank, turret mounted at the rear over a front engine deck.
# Slower and heavier than the hovering E-Ship, and it does not bob.
fs_tank:
	Inherits: example
	-Immobile:
	-WithSpriteBody:
	WithFacingSpriteBody:
	Mobile:
		Locomotor: fsvehicle
		Speed: 64
		TurnSpeed: 20
		TurnsWhileMoving: true
		Cursor: default
		BlockedCursor: default
	RenderSprites:
		Image: tank
	Tooltip:
		Name: Tank
	Health:
		HP: 90000
	Selectable:
		Bounds: 48, 48
	SelectionDecorations:
		SelectionBoxColor: 00000000
	WithSelectionRing:
		Image: selectring
		Sequence: idle
		Palette: greyscale
	# Exhaust smoke from the two outlets on the rear plate, one trait per pipe.
	# Offsets are (forward, right, up) in the actor's local frame and rotate with
	# it, so negative forward stays behind the hull at every facing. For the
	# magnitude: one Blender unit is 9.52px in the sprite, foreshortened by
	# sin(49.4) for the camera elevation, and one pixel is 32 world units at this
	# TileSize, giving ~231 units per horizontal Blender unit.
	# VisibleThroughFog matches the AlwaysVisible actors: if the tank is always
	# drawn, its exhaust should be too, whatever the fog settings say.
	LeavesTrails@EXHAUSTLEFT:
		Image: smoke
		Palette: greyscale
		Type: CenterPosition
		Offsets: -444,-116,0
		MovingInterval: 4
		VisibleThroughFog: true
	LeavesTrails@EXHAUSTRIGHT:
		Image: smoke
		Palette: greyscale
		Type: CenterPosition
		Offsets: -444,116,0
		MovingInterval: 4
		VisibleThroughFog: true
