# Fractured Steel custom actors.
# Demonstrates MiniYaml inheritance: fs_sentinel derives from the base
# `example` actor (defined in rules/example.yaml) and overrides/extends it.

# Shared movement profile for tracked vehicles. Tracks steer by driving one
# track against the other, so they pivot on the spot and then drive in straight
# lines. Inherit this from every tracked unit so they all handle the same way.
^tracked:
	Mobile:
		Locomotor: fstracked
		# Come to a stop and pivot to face the first waypoint before setting off,
		# rather than steering while rolling.
		TurnsWhileMoving: false
		# Never follow a curved trajectory between cells. Tracked hulls pivot
		# then drive straight; arcing between cells reads as sliding.
		AlwaysTurnInPlace: true
		# Deliberate and heavy, but not ponderous: stopping to pivot makes a slow
		# turn rate feel worse than it looks on paper.
		TurnSpeed: 18
		Speed: 64
		# Always pivot, then drive forward. Short reverse sounds right for a
		# destination just behind the hull, but the engine treats any short
		# move more than 90° off facing as reverse, so they back up constantly.
		CanMoveBackward: false
		Cursor: default
		BlockedCursor: default

# Shared profile for structures. Deliberately does *not* inherit `example`:
# that actor is a mobile-unit stub (Immobile, QuantizeFacingsFromSequence,
# Actors category). Buildings occupy a footprint via Building, have a single
# facing, and live in the Buildings editor category.
^building:
	AlwaysVisible:
	BodyOrientation:
		QuantizedFacings: 1
	HitShape:
	Building:
		TerrainTypes: Clear
	MapEditorData:
		Categories: Buildings
	RenderSprites:
	WithSpriteBody:
	# Below unit priority (default 10) so a drag-box over mixed actors
	# picks the army and leaves the building out. Clicking it still works.
	Selectable:
		Priority: 2
	SelectionDecorations:
		SelectionBoxColor: 00000000
	WithSelectionRing:
		Image: selectring
		Sequence: idle
		Palette: greyscale
	SequencePlaceBuildingPreview:
		Palette: greyscale
	Targetable:
		TargetTypes: Ground, GroundActor
	Armor:
		Type: Heavy
	Voiced:
		VoiceSet: fsvoice
	MustBeDestroyed:

# Buildings the player places after the HQ. Hidden until an HQ provides `structures`.
^constructed:
	Inherits: ^building
	RequiresBuildableArea:
		AreaTypes: building
		Adjacent: 3
	Buildable:
		Queue: Building
		Icon: icon
		IconPalette: greyscale
		BuildDurationModifier: 100
		Prerequisites: ~structures

fs_sentinel:
	Inherits: example
	Inherits@TRACKED: ^tracked
	-Immobile:
	-WithSpriteBody:
	WithFacingSpriteBody:
	RenderSprites:
		Image: dozer
	Tooltip:
		Name: Bulldozer
	Health:
		HP: 50000
	# 1152 world units = 36px: 60% of the 60px sprite frame (40% smaller than
	# the full-sheet mouse box, which overshot into empty padding).
	Selectable:
		Bounds: 1152, 1152
	# Keep SelectionDecorations for the health bar, but hide its corner-bracket
	# box (transparent) so only the custom green ground ring shows.
	SelectionDecorations:
		SelectionBoxColor: 00000000
	# Custom trait (OpenRA.Mods.Example): draws the ring in the world layer,
	# beneath the unit, only while selected.
	WithSelectionRing:
		Image: selectring
		Sequence: idle
		Palette: greyscale
	Targetable:
		TargetTypes: Ground, GroundActor
	Valued:
		Cost: 800
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 10
		BuildDuration: 250
		BuildDurationModifier: 100
		Icon: icon
		IconPalette: greyscale
		Prerequisites: ~fs_vfoundry
		Description: unit-dozer.description
	Harvester:
		Resources: Alloy
		SearchFromProcRadius: 24
		HarvestCursor: harvest
	StoresResources:
		Capacity: 20
		Resources: Alloy
	DockClientManager:
		EnterCursor: enter
		EnterBlockedCursor: enter-blocked

# Tracked tank, turret mounted at the rear over a front engine deck.
fs_tank:
	Inherits: example
	Inherits@TRACKED: ^tracked
	-Immobile:
	-WithSpriteBody:
	WithFacingSpriteBody:
	RenderSprites:
		Image: tank
	Tooltip:
		Name: Tank
	Health:
		HP: 90000
	Selectable:
		Bounds: 1152, 1152
	SelectionDecorations:
		SelectionBoxColor: 00000000
	WithSelectionRing:
		Image: selectring
		Sequence: idle
		Palette: greyscale
	# Exhaust smoke from the two outlets on the rear plate, one trait per pipe.
	# Offsets are (forward, right, up) in the actor's local frame and rotate with
	# it, so negative forward stays behind the hull at every facing. For the
	# magnitude: one Blender unit is 9.52px in the sprite, foreshortened by
	# sin(49.4) for the camera elevation, and one pixel is 32 world units at this
	# TileSize, giving ~231 units per horizontal Blender unit.
	# VisibleThroughFog matches the AlwaysVisible actors: if the tank is always
	# drawn, its exhaust should be too, whatever the fog settings say.
	LeavesTrails@EXHAUSTLEFT:
		Image: smoke
		Palette: greyscale
		Type: CenterPosition
		Offsets: -444,-116,0
		MovingInterval: 4
		VisibleThroughFog: true
	LeavesTrails@EXHAUSTRIGHT:
		Image: smoke
		Palette: greyscale
		Type: CenterPosition
		Offsets: -444,116,0
		MovingInterval: 4
		VisibleThroughFog: true
	Targetable:
		TargetTypes: Ground, GroundActor
	Armor:
		Type: Heavy
	# Turret sheet is centred on the ring. 33 is 2 px ahead of -67
	# (classic-fudge: 100 WU ≈ 2 px). Negative Z keeps it on the deck.
	Turreted:
		TurnSpeed: 28
		Offset: 33,0,-80
		RealignDelay: 40
	AttackTurreted:
	Armament:
		Weapon: paladingun
		Turret: primary
		# Barrel tip is ~22 px from the ring. Classic-fudge needs ~1100 WU
		# or the puff sits on the hull centre (654 was only ~13 px).
		LocalOffset: 1100,0,0
		Recoil: 120
		RecoilRecovery: 12
		MuzzleSequence: muzzle
		MuzzlePalette: greyscale
		Cursor: default
		OutsideRangeCursor: attackoutsiderange
	WithSpriteTurret:
		Sequence: turret
		Palette: greyscale
		Recoils: true
	WithMuzzleOverlay:
	AutoTarget:
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground, GroundActor
		ValidRelationships: Enemy

# Vehicle Foundry gun vehicle. Uses the tank sheet; combat stats from the GDD.
fs_paladin:
	Inherits: fs_tank
	Tooltip:
		Name: Paladin
	Valued:
		Cost: 900
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 20
		BuildDuration: 300
		BuildDurationModifier: 100
		Icon: icon
		IconPalette: greyscale
		Prerequisites: ~fs_vfoundry
		Description: unit-paladin.description

# Round headquarters with a front double door and a circular glass skylight.
fs_hq:
	Inherits: ^building
	Building:
		Footprint: xxxxxxxx xxxxxxxx xxxxxxxx xxxxxxxx xxxxxxxx xxxxxxxx xxxxxxxx xxxxxxxx
		Dimensions: 8,8
	RenderSprites:
		Image: hq
	Tooltip:
		Name: HQ
	Health:
		HP: 200000
	Selectable:
		# 164px box, shifted down so it covers the terrace and entrance
		# (the sprite has empty sky in the top quarter).
		Bounds: 5248, 5248, 0, 1632
	ProvidesPrerequisite:
		Prerequisite: structures
	BaseBuilding:
	GivesBuildableArea:
		AreaTypes: building
	BaseProvider:
		Range: 16c0
	Production:
		Produces: Building, Defense
	PrimaryBuilding:
		Cursor: default
	Power:
		Amount: 0
	MustBeDestroyed:
		RequiredForShortGame: true

# Two front-facing barracks with a roof flag on the left chimney
# and a rectangular hedge. Doors point +X, same as the HQ entrance.
fs_academy:
	Inherits: ^constructed
	Building:
		Footprint: xxxxx xxxxx xxxxx xxxxx
		Dimensions: 5,4
	RenderSprites:
		Image: academy
	Tooltip:
		Name: Crew Academy
	Health:
		HP: 80000
	Selectable:
		# ~108x90px over the pair of barracks and the hedge.
		Bounds: 3456, 2880
	Valued:
		Cost: 1000
	Buildable:
		BuildPaletteOrder: 40
		BuildDuration: 350
		Prerequisites: ~structures, fs_plant
		Description: building-academy.description
	Power:
		Amount: -20
	ProvidesPrerequisite:
		Prerequisite: fs_academy

# Modular Frame. Parts are conditions; AssemblyBay / GrantExternalConditionToProduced
# grant the loadout. GrantCondition covers editor-placed Frames.
fs_frame:
	Inherits: example
	Inherits@TRACKED: ^tracked
	-Immobile:
	-WithSpriteBody:
	WithFacingSpriteBody:
	Mobile:
		Speed: 48
	RenderSprites:
		Image: frame
	Tooltip:
		Name: Frame
	Health:
		HP: 120000
	Selectable:
		Bounds: 1920, 1920
	SelectionDecorations:
		SelectionBoxColor: 00000000
	WithSelectionRing:
		Image: selectring
		Sequence: idle
		Palette: greyscale
	Valued:
		Cost: 2200
	Buildable:
		Queue: Mech
		BuildPaletteOrder: 10
		BuildDuration: 600
		BuildDurationModifier: 100
		Icon: icon
		IconPalette: greyscale
		Prerequisites: ~fs_assembly
		Description: unit-frame.description
	Targetable:
		TargetTypes: Ground, GroundActor
	ExternalCondition@TORSOASSAULT:
		Condition: torso-assault
	ExternalCondition@LEGSBIPEDAL:
		Condition: legs-bipedal
	ExternalCondition@ARMSWORD:
		Condition: arm-sword
	ExternalCondition@ARMSHIELD:
		Condition: arm-shield
	GrantCondition@TORSO:
		Condition: torso-assault
	GrantCondition@LEGS:
		Condition: legs-bipedal
	GrantCondition@SWORD:
		Condition: arm-sword
	GrantCondition@SHIELD:
		Condition: arm-shield
	Armor:
		Type: Heavy
		RequiresCondition: torso-assault
	SpeedMultiplier@BIPEDAL:
		RequiresCondition: legs-bipedal
		Modifier: 100
	DamageMultiplier@SHIELD:
		RequiresCondition: arm-shield
		Modifier: 80
	AttackFrontal:
		FacingTolerance: 160
	Armament@LEFT:
		Name: primary
		Weapon: sword
		Cursor: default
		OutsideRangeCursor: attackoutsiderange
		MuzzlePalette: greyscale
		RequiresCondition: arm-sword
	AutoTarget:
	AutoTargetPriority@DEFAULT:
		ValidTargets: Ground, GroundActor
		ValidRelationships: Enemy
	WithIdleOverlay@TORSO:
		Image: frame
		Sequence: torso
		Palette: greyscale
		RequiresCondition: torso-assault
	WithIdleOverlay@SWORD:
		Image: frame
		Sequence: sword
		Palette: greyscale
		RequiresCondition: arm-sword
	WithIdleOverlay@SHIELD:
		Image: frame
		Sequence: shield
		Palette: greyscale
		RequiresCondition: arm-shield

