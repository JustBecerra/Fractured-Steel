^baseworld:
	Inherits: ^palettes
	ActorMap:
	# Required by ConditionalTerrainLightSource. Default values are neutral,
	# so this adds no global tint on its own.
	TerrainLighting:
	AlwaysVisible:
	ControlGroups:
	Faction@Random:
		InternalName: Random
		Name: faction-random.name
		RandomFactionMembers: example
		Description: faction-random.description
	Faction@example:
		InternalName: example
		Name: faction-example.name
		Description: faction-example.description
	LoadWidgetAtGameStart:
	MusicPlaylist:
	ScreenMap:
	Selection:
	TerrainRenderer:

world:
	Inherits: ^baseworld
	PathFinder:
	# Hovercraft-style movement, used by the E-Ship.
	Locomotor@fsvehicle:
		Name: fsvehicle
		TerrainSpeeds:
			Clear: 100
	# Tracked vehicles get their own locomotor so their terrain handling can
	# diverge from the hovering one later: rough ground should slow tracks down,
	# and tracks are where crushing belongs. Identical for now, since Clear is
	# the only terrain type that exists.
	Locomotor@fstracked:
		Name: fstracked
		TerrainSpeeds:
			Clear: 100
	ColorPickerManager:
		PreviewActor: example.colorpicker
	CreateMapPlayers:
	CustomTerrainDebugOverlay:
	DebugVisualizations:
	MapStartingLocations:
	SpawnMapActors:
	SpawnStartingUnits:
	StartingUnits@Example:
		BaseActor: fs_sentinel
		SupportActors: fs_tank, fs_tank
		Factions: example
		ClassName: options-starting-units.unlabeled

editorworld:
	Inherits: ^baseworld
	BuildableTerrainOverlay:
		AllowedTerrainTypes:
		Palette:
	EditorActionManager:
	EditorActorLayer:
	EditorCursorLayer:
	MarkerLayerOverlay:
	TerrainGeometryOverlay:
