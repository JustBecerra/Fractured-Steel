^baseworld:
	Inherits: ^palettes
	ActorMap:
	# Required by ConditionalTerrainLightSource. Default values are neutral,
	# so this adds no global tint on its own.
	TerrainLighting:
	AlwaysVisible:
	ControlGroups:
	Faction@Random:
		InternalName: Random
		Name: faction-random.name
		RandomFactionMembers: example
		Description: faction-random.description
	Faction@example:
		InternalName: example
		Name: faction-example.name
		Description: faction-example.description
	LoadWidgetAtGameStart:
	MusicPlaylist:
	ScreenMap:
	Selection:
	TerrainRenderer:

world:
	Inherits: ^baseworld
	PathFinder:
	# Required by the Building trait. A dictionary of placed buildings; adds no
	# gameplay on its own. World-only — must not go on ^baseworld or the editor
	# will reject it.
	BuildingInfluence:
	# Unused hover locomotor kept so later hover units can share it.
	Locomotor@fsvehicle:
		Name: fsvehicle
		TerrainSpeeds:
			Clear: 100
	# Alloy cells are not in either locomotor, so nothing can path onto a pile.
	# The dozer harvests from a neighbouring cell.
	Locomotor@fstracked:
		Name: fstracked
		TerrainSpeeds:
			Clear: 100
	# Alloy is a map resource (junkyards). ResourceIndex 1 is stored per cell
	# in map.bin. Density there is a byte, so AlloyPiles raises each painted
	# cell to 30000. One density unit is one Alloy.
	ResourceLayer:
		ResourceTypes:
			Alloy:
				ResourceIndex: 1
				TerrainType: Alloy
				AllowedTerrainTypes: Clear
				MaxDensity: 30000
	AlloyPiles:
	ResourceRenderer:
		ResourceTypes:
			Alloy:
				Image: resources
				Sequences: junk01, junk02, junk03
				Palette: greyscale
				Name: resource-alloy.name
	ResourceClaimLayer:
	ColorPickerManager:
		PreviewActor: example.colorpicker
	CreateMapPlayers:
	MapOptions:
		ShortGameCheckboxEnabled: true
		ShortGameCheckboxDisplayOrder: 2
		TechLevelDropdownVisible: false
		GameSpeedDropdownDisplayOrder: 1
	CustomTerrainDebugOverlay:
	DebugVisualizations:
	MapStartingLocations:
	SpawnMapActors:
	SpawnStartingUnits:
	StartingUnits@Example:
		BaseActor: fs_hq
		Factions: example
		ClassName: options-starting-units.hq
	ProductionQueueFromSelection:
		ProductionPaletteWidget: PRODUCTION_PALETTE

editorworld:
	Inherits: ^baseworld
	BuildableTerrainOverlay:
		AllowedTerrainTypes:
		Palette:
	EditorResourceLayer:
		ResourceTypes:
			Alloy:
				ResourceIndex: 1
				TerrainType: Alloy
				AllowedTerrainTypes: Clear
				MaxDensity: 30000
	ResourceRenderer:
		ResourceTypes:
			Alloy:
				Image: resources
				Sequences: junk01, junk02, junk03
				Palette: greyscale
				Name: resource-alloy.name
	EditorActionManager:
	EditorActorLayer:
	EditorCursorLayer:
	MarkerLayerOverlay:
	TerrainGeometryOverlay:
